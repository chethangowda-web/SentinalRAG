name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Same version as requirements-dev.txt; newer releases enable more rules by default
      - run: pip install ruff==0.8.6
      - run: ruff check app/ tests/

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinelrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinelrag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        # Keep in step with qdrant-client in requirements.txt and docker-compose.yml
        image: qdrant/qdrant:v1.16.2
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      # CPU-only torch first: the default wheel pulls ~2 GB of CUDA libraries
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -v --tb=short --cov=app --cov-report=term --cov-report=xml --ignore=tests/failuretest --ignore=tests/performance --ignore=tests/stresstest
        env:
          DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinelrag
          # Disposable CI database: test_migrations.py drops and recreates its schema
          MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinelrag
          QDRANT_URL: http://localhost:6333
          # Dummy key so config validation passes; tests mock all LLM calls
          GEMINI_API_KEY: ci-dummy-key
      - uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          directory: backend
          fail_ci_if_error: false

  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: STATIC_EXPORT=1 npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke tests (API mocked) and accessibility scan
        run: npm run test:e2e

  docker-build:
    name: Single-container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sentinelrag:ci .
      - name: Web UI is baked into the image
        run: docker run --rm --entrypoint sh sentinelrag:ci -c 'test -f /app/static/index.html && test -f /app/static/login/index.html && ls /app/static'
      - name: Runs as an unprivileged user that can write where the app needs to
        run: >-
          docker run --rm --entrypoint sh sentinelrag:ci -c
          'test "$(id -un)" = sentinel && touch /data/uploads/probe /data/processed/probe /app/uploads_probe && mkdir -p "$HOME/.cache/huggingface"'
